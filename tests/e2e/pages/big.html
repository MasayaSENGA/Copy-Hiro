<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>big table</title></head>
<body>
<table id="big" border="1"></table>
<script>
  const n = Number(new URLSearchParams(location.search).get('rows') || 10000);
  const cols = Number(new URLSearchParams(location.search).get('cols') || 8);
  const t = document.getElementById('big');
  const head = t.createTHead().insertRow();
  for (let c = 0; c < cols; c++) { const th = document.createElement('th'); th.textContent = '列' + c; head.appendChild(th); }
  const body = t.createTBody();
  for (let r = 0; r < n; r++) {
    const tr = body.insertRow();
    for (let c = 0; c < cols; c++) tr.insertCell().textContent = 'r' + r + 'c' + c;
  }
  document.title = 'big ' + n;
</script>
</body>
</html>
